<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tack för din bokning | Apocura privatläkartjänster</title>
<style>
:root{--bg:#F3F7F4;--ink:#11261F;--muted:#54675F;--primary:#1E5F4F;--card:#fff;--line:#D6E2DB}
@media (prefers-color-scheme:dark){:root{--bg:#0E1815;--ink:#E9F2EE;--muted:#9DB3A9;--primary:#6FD0AE;--card:#15241F;--line:#27403A}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;display:grid;place-items:center;min-height:100vh;padding:16px}
main{max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{margin:0 0 8px;font-size:26px}
.ok{width:48px;height:48px;border-radius:50%;background:var(--primary);color:var(--bg);display:grid;place-items:center;font-size:26px;margin-bottom:12px}
p{color:var(--muted)}
a{color:var(--primary);font-weight:600}
</style>
</head>
<body>
<main>
<div class="ok" aria-hidden="true">✓</div>
<h1>Tack, din betalning är genomförd</h1>
<p>Du får en bekräftelse med tid och instruktioner på den e-postadress du angav. Din tid är bokad först när du har fått bekräftelsen.</p>
<p>Hör av dig om du inte fått den inom en timme. Titta först i skräppostmappen.</p>
<p><a href="./">Tillbaka till startsidan</a></p>
</main>
</body>
</html>
